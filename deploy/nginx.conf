map $request_method $auth_rate_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $auth_rate_key zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_status:10m rate=5r/s;
server {
  listen 8080;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;
  set $web http://web:3000;
  client_max_body_size 256k;
  limit_req_status 429;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  location = /healthz { proxy_pass $api; }
  location ~ ^/api/v1/(auth/login|auth/forgot|setup)$ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/v1/public/status/ {
    limit_req zone=public_status burst=20 nodelay;
    proxy_pass $api;
    proxy_set_header Host $host;
    access_log off;
  }
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 65s;
    # Push credentials are in the path; never write request paths to access logs.
    access_log off;
  }
  location / { proxy_pass $web; proxy_set_header Host $host; }
}
